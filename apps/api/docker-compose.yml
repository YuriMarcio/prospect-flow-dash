services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3333:3333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - delivery-net

networks:
  delivery-net:
    external: true