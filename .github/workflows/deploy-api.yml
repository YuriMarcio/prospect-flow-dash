name: Deploy API to VPS

on:
  # Disparo manual (aba Actions → Run workflow) pra redeployar sem precisar de um commit.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "apps/api/**"
      - "packages/types/**"
      # O Dockerfile da API faz `npm ci` a partir destes dois — uma correção só no
      # lockfile também precisa redeployar a API, senão ela fica na versão antiga.
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/projetos/prospect-flow-dash
            git fetch origin master
            git reset --hard origin/master
            docker compose -f apps/api/docker-compose.yml up -d --build
            docker image prune -f
